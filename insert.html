
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Insert Student</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f2ef96;
            margin: 0;
            padding: 5px;
            color: #222;
        }

        /* White title and navigation header */
        .top-header {
            background-color: #FFFFFF;
            width: 100%;
            padding: 25px 20px 15px;
            border-radius: 15px 15px 0 0;
            text-align: center;
        }

        .top-header h1 {
            background-color: #FFFFFF;
            color: #2864e8;
            font-size: 36px;
            margin: 20px 0 30px;
            padding: 5px;
        }

        .top-header nav {
            background-color: #FFFFFF;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px 28px;
            padding: 10px 0;
        }

        .top-header nav a {
            color: #0066ff;
            text-decoration: none;
            font-size: 16px;
        }

        .top-header nav a:hover {
            text-decoration: underline;
        }

        /* Insert student content */
        .container {
            max-width: 850px;
            margin: 25px auto;
            padding: 25px;
            text-align: center;
        }

        .banner {
            width: 100%;
            height: auto;
            display: block;
            margin: 0 auto 25px;
            border-radius: 10px;
        }

        h2 {
            color: #2864e8;
            margin-bottom: 20px;
        }

        .student-form {
            max-width: 500px;
            margin: 0 auto;
            text-align: left;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #b9c9e8;
            border-radius: 6px;
            font-size: 16px;
            background-color: #FFFFFF;
        }

        input:focus {
            outline: 2px solid #2864e8;
            border-color: #2864e8;
        }

        .submit-button {
            display: block;
            width: 100%;
            background-color: #2864e8;
            color: #FFFFFF;
            border: none;
            padding: 13px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        .submit-button:hover {
            background-color: #174bb5;
        }

        .submit-button:disabled {
            background-color: #999999;
            cursor: not-allowed;
        }

        #status {
            margin-top: 20px;
            font-weight: bold;
            text-align: center;
            overflow-wrap: anywhere;
        }

        .home-button {
            display: inline-block;
            background-color: #2864e8;
            color: #FFFFFF;
            text-decoration: none;
            padding: 12px 25px;
            border-radius: 6px;
            font-size: 16px;
            margin-top: 25px;
        }

        .home-button:hover {
            background-color: #174bb5;
        }

        @media (max-width: 600px) {
            .top-header {
                padding: 15px 10px;
            }

            .top-header h1 {
                font-size: 27px;
            }

            .top-header nav {
                gap: 12px 18px;
            }

            .container {
                padding: 15px 10px;
            }
        }
    </style>
</head>

<body>

    <!-- WHITE HEADER -->
    <header class="top-header">
        <h1>INSERT STUDENT</h1>

        <nav>
            <a href="/">Home</a>
            <a href="/list.html">List Students</a>
            <a href="/listOne.html">List Required Student</a>
            <a href="/insert.html">Insert Student</a>
            <a href="/update.html">Update Student</a>
            <a href="/delete.html">Delete Student</a>
        </nav>
    </header>

    <!-- INSERT STUDENT FORM -->
    <main class="container">

        <img
            class="banner"
            src="image/inserte.jpg"
            alt="Insert Student"
        >

        <h2>Enter Student Details</h2>

        <form id="studentForm" class="student-form">

            <div class="form-group">
                <label for="studentId">Student ID</label>
                <input
                    type="number"
                    id="studentId"
                    name="studentId"
                    placeholder="Enter student ID"
                    required
                >
            </div>

            <div class="form-group">
                <label for="studentName">Student Name</label>
                <input
                    type="text"
                    id="studentName"
                    name="studentName"
                    placeholder="Enter student name"
                    required
                >
            </div>

            <div class="form-group">
                <label for="totalMarks">Total Marks</label>
                <input
                    type="number"
                    id="totalMarks"
                    name="totalMarks"
                    placeholder="Enter total marks"
                    min="0"
                    required
                >
            </div>

            <button type="submit" class="submit-button" id="submitButton">
                Insert Student
            </button>

        </form>

        <p id="status" role="status"></p>

        <a href="/" class="home-button">Go to Home Page</a>

    </main>

    <script>
        const studentForm = document.getElementById("studentForm");
        const statusMessage = document.getElementById("status");
        const submitButton = document.getElementById("submitButton");

        studentForm.addEventListener("submit", async function (event) {
            event.preventDefault();

            const studentId = document.getElementById("studentId").value;
            const studentName =
                document.getElementById("studentName").value.trim();
            const totalMarks = document.getElementById("totalMarks").value;

            if (!studentId || !studentName || totalMarks === "") {
                statusMessage.textContent =
                    "Please fill in all student details.";
                statusMessage.style.color = "red";
                return;
            }

            submitButton.disabled = true;
            statusMessage.textContent = "Inserting student...";
            statusMessage.style.color = "#222";

            try {
                const response = await fetch("/students", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    /* These property names match app7a-0.js */
                    body: JSON.stringify({
                        sno: Number(studentId),
                        name: studentName,
                        total: Number(totalMarks)
                    })
                });

                const message = await response.text();

                if (!response.ok) {
                    throw new Error(message || "Failed to insert student.");
                }

                statusMessage.textContent =
                    message || "Student inserted successfully!";
                statusMessage.style.color = "green";

                studentForm.reset();

            } catch (error) {
                statusMessage.textContent =
                    error.message || "Unable to insert student.";
                statusMessage.style.color = "red";
            } finally {
                submitButton.disabled = false;
            }
        });
    </script>

</body>
</html>
